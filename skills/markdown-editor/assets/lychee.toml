# Starter lychee config from the markdown-editor skill; adjust to the project's style.
extensions = ["md"]

exclude_loopback = true

# Paths to skip, e.g. vendored docs or installed agent skills. Sweeps run with
# --hidden, so they check dot-directories too: list any to skip here. Entries
# are regular expressions matched against the path, not globs:
# '(^|/)vendor/' works, 'vendor/**/*.md' does not.
# exclude_path = ['(^|/)vendor/']

# URL regexes to skip, with the same comment conventions as .lycheeignore:
# a reason above each entry, dated only for reachability reasons.
# Reachable but fails the link check. (Last access: YYYY-MM-DD)
# exclude = ['^https://example\.org/page$']
