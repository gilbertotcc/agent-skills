name: Test cli-designer

# One workflow per skill with scripts, so its tests run only when the
# skill or its tests change.
on:
  pull_request:
    paths:
    - 'skills/cli-designer/**'
    - 'tests/cli-designer/**'
    - '.github/workflows/test-cli-designer.yml'
  push:
    branches:
    - 'main'
    paths:
    - 'skills/cli-designer/**'
    - 'tests/cli-designer/**'
    - '.github/workflows/test-cli-designer.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test cli-designer scripts
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Run tests
      run: tests/cli-designer/run.sh
