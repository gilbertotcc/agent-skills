name: Check Markdown files

on:
  pull_request:
    paths:
    - '**/*.md'
    - '**/.markdownlint-cli2.yaml'
    - '.github/workflows/check-markdown.yml'
    - 'skills/**/*.md'
    - .lycheeignore
    - lychee.toml
  push:
    branches:
    - 'main'
    paths:
    - '**/*.md'
    - '**/.markdownlint-cli2.yaml'
    - '.github/workflows/check-markdown.yml'
    - 'skills/**/*.md'
    - .lycheeignore
    - lychee.toml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-markdown:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Run markdownlint-cli2
      uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0

  check-urls:
    name: Check links
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Link Checker
      uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
      with:
        args: "--no-progress --hidden ."
        fail: true
        failIfEmpty: false
