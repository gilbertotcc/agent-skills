name: Check Markdown files

on:
  pull_request:
    paths:
    - '**/*.md'
    - '**/.markdownlint-cli2.yaml'
    - '.github/workflows/check-markdown.yml'
    - 'skills/markdown-editor/scripts/**'
    - .lycheeignore
    - lychee.toml
  push:
    branches:
    - 'main'
    paths:
    - '**/*.md'
    - '**/.markdownlint-cli2.yaml'
    - '.github/workflows/check-markdown.yml'
    - 'skills/markdown-editor/scripts/**'
    - .lycheeignore
    - lychee.toml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-markdown:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: lts/*
    - name: Run markdownlint-cli2
      run: skills/markdown-editor/scripts/lint.sh
    # The repo config sets `fix: true`, so the sweep fixes issues silently.
    - name: Fail on auto-fixable issues
      run: git diff --exit-code

  check-urls:
    name: Check links
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Link Checker
      uses: lycheeverse/lychee-action@v2.9.0
      with:
        args: "--no-progress --timeout 30 --max-concurrency 10 ."
        fail: true
        failIfEmpty: false
