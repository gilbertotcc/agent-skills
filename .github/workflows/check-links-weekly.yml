name: Check links weekly

on:
  schedule:
  # Mondays 06:17 UTC, off the top of the hour.
  - cron: '17 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check-links:
    name: Check links and sync issues
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Link Checker
      id: lychee
      uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
      with:
        args: "--no-progress --hidden --verbose ."
        format: json
        output: lychee/out.json
        jobSummary: false
        fail: false
        failIfEmpty: false
    # Exit code 2 means broken links, which the issues report; anything else
    # is a lychee or config error.
    - name: Check lychee exit code
      env:
        EXIT_CODE: ${{ steps.lychee.outputs.exit_code }}
      run: |
        if [ "$EXIT_CODE" != 0 ] && [ "$EXIT_CODE" != 2 ]; then
          echo "::error::lychee failed with exit code $EXIT_CODE"
          exit 1
        fi
    - name: Sync broken-link issues
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: .github/scripts/sync-link-issues.sh lychee/out.json
